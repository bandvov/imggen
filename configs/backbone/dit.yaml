# Architecture flavor only; pick the size in the experiment (or `backbone.size=b` on the CLI).
backbone:
  name: dit
  head_dim: 64
  attn: softmax          # per-layer mix: attn_pattern: [linear, linear, linear, softmax]
  ffn: dense
  in_channels: 4        # must match the autoencoder's latent channels
  text_dim: 2048         # must match the text encoder's embedding size
